[profile.default]
src = "src"
test = "test"
libs = ["lib"]
solc = "0.8.30"
via_ir = true
evm_version = "prague"
optimizer = true
optimizer_runs = 600

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 32
fail_on_revert = false
call_override = false
show_metrics = true

[rpc_endpoints]
testnet = "${HEDERA_JSON_RPC_URL}"
