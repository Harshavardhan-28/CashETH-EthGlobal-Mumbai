name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm lint
      # The aqua anvil tests need Foundry and run in the contracts job.
      - run: pnpm -r --workspace-concurrency=1 --filter '!@casheth/aqua' test
      - run: pnpm -F @casheth/aqua exec vitest run --project unit
      - run: pnpm test:scripts

  contracts:
    name: Contracts (Foundry) and Aqua on anvil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Build and check contract sizes
        working-directory: contracts
        run: forge build --sizes
      - name: Unit, fuzz and invariant tests
        working-directory: contracts
        run: forge test
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -F @casheth/shared build
      - name: Aqua integration tests against anvil
        run: pnpm -F @casheth/aqua exec vitest run --project anvil

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
