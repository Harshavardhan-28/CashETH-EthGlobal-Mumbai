packages:
  - packages/*
  - apps/*
  - agents
  - frontend
allowBuilds:
  '@reown/appkit': false
  bufferutil: false
  esbuild: true
  keccak: false
  protobufjs: false
  utf-8-validate: false
overrides:
  # hedera-agent-kit pins @langchain/core 1.1.24 but resolves @langchain/langgraph 1.7, which needs ^1.3.4 (its import fails otherwise)
  '@langchain/core': 1.3.4
